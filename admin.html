<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subharti TechBooks - Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
    .login-box { max-width: 400px; margin: 80px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .login-btn { background: #004085; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; }
    .table-wrapper { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    table th, table td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    table th { background: #004085; color: white; }
    .btn-accept { background: #28a745; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
    .status-pending { color: #d97706; font-weight: bold; }
    .status-accepted { color: #28a745; font-weight: bold; }
    .status-rejected { color: #dc3545; font-weight: bold; }
    .back-home { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #004085; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Subharti<span>TechBooks [Admin]</span></a>
  </header>

  <!-- Login Form Section -->
  <div id="loginSection" class="login-box">
    <h2>🔐 Admin Login</h2>
    <p>Orders access karne ke liye password dalein:</p>
    <form id="adminLoginForm">
      <input type="password" id="adminPassword" placeholder="Enter Admin Password" required>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <p id="errorMsg" style="color: red; margin-top: 10px; display: none;">Galat password! Phir se try karein.</p>
  </div>

  <!-- Protected Dashboard Section -->
  <div id="dashboardSection" class="admin-container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="back-home">← Back to Store</a>
      <button onclick="logout()" style="background: #6c757d; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px;">Logout</button>
    </div>
    <h2>Library Orders Management Dashboard</h2>
    <p>Incoming orders manage karein:</p>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Student Name</th>
            <th>Phone</th>
            <th>Book Title</th>
            <th>Price</th>
            <th>Address</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="8" style="text-align: center;">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const ADMIN_SECRET = "subharti123"; // Aapka Password yahan hai

    const SUPABASE_URL = "https://ddtbqlalhfokedxbhdhj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_egINPJu1IQV6kYN4EXLF3A_8pIpi6qz";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Login Form Submit Check
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const inputPass = document.getElementById('adminPassword').value;

      if (inputPass === ADMIN_SECRET) {
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        showDashboard();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });

    function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      fetchOrders();
    }

    function logout() {
      sessionStorage.removeItem('isAdminLoggedIn');
      window.location.reload();
    }

    // Auto-check session on page load
    if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
      showDashboard();
    }

    async function fetchOrders() {
      const { data, error } = await _supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('ordersBody');
      tbody.innerHTML = '';

      if (error) {
        tbody.innerHTML = `<tr><td colspan="8" style="color: red; text-align: center;">Error: ${error.message}</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center;">No orders found.</td></tr>`;
        return;
      }

      data.forEach(order => {
        let statusClass = 'status-pending';
        if (order.status === 'Accepted') statusClass = 'status-accepted';
        if (order.status === 'Rejected') statusClass = 'status-rejected';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>#${order.id}</td>
          <td>${order.customer_name}</td>
          <td>${order.phone}</td>
          <td>${order.book_title}</td>
          <td>₹${order.price}</td>
          <td>${order.address}</td>
          <td><span class="${statusClass}">${order.status}</span></td>
          <td>
            <button class="btn-accept" onclick="updateStatus(${order.id}, 'Accepted')">Accept</button>
            <button class="btn-reject" onclick="updateStatus(${order.id}, 'Rejected')">Reject</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateStatus(id, newStatus) {
      const { error } = await _supabase
        .from('orders')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert('Status update error: ' + error.message);
      } else {
        alert(`Order #${id} ${newStatus}!`);
        fetchOrders();
      }
    }
  </script>
</body>
</html>
