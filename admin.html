<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Manage Orders</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header>
    <a href="#" class="logo">Admin <span>Dashboard</span></a>
  </header>

  <div class="container">
    <h2 class="section-title">Live Orders Management</h2>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Phone</th>
            <th>Book Title</th>
            <th>Price</th>
            <th>Address</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTable">
          <!-- Live orders here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ddtbqlalhfokedxbhdhj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_egINPJu1IQV6kYN4EXLF3A_8pIpi6qz";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadOrders() {
      const { data: orders, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const tableBody = document.getElementById('ordersTable');
      tableBody.innerHTML = '';

      orders.forEach(order => {
        const row = document.createElement('tr');
        const status = order.status || 'Pending';

        row.innerHTML = `
          <td>#${order.id}</td>
          <td>${order.customer_name}</td>
          <td>${order.phone}</td>
          <td>${order.book_title}</td>
          <td>₹${order.price}</td>
          <td>${order.address}</td>
          <td><span class="badge badge-${status.toLowerCase()}">${status}</span></td>
          <td>
            ${status === 'Pending' ? `
              <button onclick="updateOrderStatus(${order.id}, 'Accepted')" class="btn-accept">Accept</button>
              <button onclick="updateOrderStatus(${order.id}, 'Rejected')" class="btn-reject">Reject</button>
            ` : 'Done'}
          </td>
        `;

        tableBody.appendChild(row);
      });
    }

    async function updateOrderStatus(orderId, newStatus) {
      const { error } = await supabaseClient
        .from('orders')
        .update({ status: newStatus })
        .eq('id', orderId);

      if (error) {
        alert('Update Failed: ' + error.message);
      } else {
        alert(`Order #${orderId} is now ${newStatus}`);
        loadOrders();
      }
    }

    loadOrders();
  </script>
</body>

</html>
